<!doctype html>
<!-- Not part of the site: scripts/og-home.mjs opens this through the dev server to take the
     home page's link preview (public/og.jpg), 1200 by 630. The words are the home page's own
     (HOME in api/_og/describe.js), beside the landing's garden with your cloud out over a plot,
     and what's written over the clouds as the landing has it: your plan's meter over yours, and
     whose plan the other one is.
     Open it yourself to see it before taking the picture. -->
<meta charset="utf-8">
<title>Rainshare's link preview</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:linear-gradient(180deg,#D3E2FF 0%,#EAF0FF 46%,#F5F8FF 100%);color:#12203A;font-family:'Zen Maru Gothic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:absolute;right:-8px;top:-30px;width:860px;height:792px;display:block;
    -webkit-mask-image:linear-gradient(to right,transparent 4%,#000 34%);mask-image:linear-gradient(to right,transparent 4%,#000 34%)}
  .words{position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .mark{display:flex;align-items:center;gap:12px;font:900 40px/1 'Zen Maru Gothic';letter-spacing:-.01em}
  .mark img{width:64px;height:64px;margin:-6px -4px -6px -8px}
  h1{margin:0;font:900 50px/1.16 'Zen Maru Gothic';letter-spacing:-.025em}
  h1>span{display:block;white-space:nowrap}
  p{margin:0;font:500 23px/1.45 'Zen Maru Gothic';color:#56627A;max-width:400px}
  /* lit as the site has it (../theme.css): as the logo's drop is, with a soft glow */
  .ai{background:linear-gradient(180deg,#8DBBFF 6%,#4A82FF 40%,#2558EE 64%,#1A3CC8 96%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 .05em .18em rgba(47,99,240,.38))}

  /* the scene's labels, as the landing has them (./landing.css), larger: a preview is mostly
     seen at half this size or less. They're laid over the garden where the canvas is. */
  .pins{position:absolute;right:-8px;top:-30px;width:860px;height:792px}
  .pin{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.86);box-shadow:0 0 0 1.5px rgba(18,32,58,.1),0 4px 14px rgba(18,32,58,.06);font:700 19px 'Zen Maru Gothic';white-space:nowrap}
  /* over the other cloud: whose plan that one is */
  .friend{padding:4px 15px 4px 4px;translate:-50% -100%}
  .friend i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#12203A;font:800 15px/28px 'Zen Maru Gothic';font-style:normal;text-align:center}
  /* your cloud: what it is and when it resets, over it, with a ring that runs down */
  .plan{padding:10px 26px 10px 12px;gap:14px;line-height:1.2;translate:-50% -100%}
  .plan b,.plan small{display:block}
  .plan b{font-size:27px}
  .plan small{font:500 21px/1.3 'Zen Maru Gothic';color:#56627A}
  .ring{flex:none;width:48px;height:48px;rotate:-90deg}
  .ring circle{fill:none;stroke:rgba(47,99,240,.16);stroke-width:3}
  .ring .left{stroke:#2F63F0;stroke-linecap:round;stroke-dasharray:100}
</style>
<body>
<canvas></canvas>
<div class="pins"></div>
<div class="words">
  <div class="mark"><img src="/logo.png" alt=""><span>R<span class="ai">ai</span>nshare</span></div>
  <h1></h1>
  <p>People post ideas and projects. Your agent does the work, on your plan.</p>
</div>
<script type="module">
  import { createGarden } from './garden-scene.js';
  import { PLOTS, FRIEND } from './plots.js';
  import { HOME } from '../../api/_og/describe.js';

  // The headline, a sentence to a line where it fits, with the "ai" in "rain" lit as the site's is.
  const lit = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\b([Rr])(ai)(n)/g, '$1<span class="ai">$2</span>$3');
  const [ask, ...rest] = HOME.social.split(/(?<=\?)\s+/), words = rest.join(' ').split(' '), half = Math.ceil(words.length / 2);
  document.querySelector('h1').innerHTML = [ask, words.slice(0, half).join(' '), words.slice(half).join(' ')].filter(Boolean).map(l => `<span>${lit(l)}</span>`).join('');

  // Over Kai's cloud, whose plan it is; over yours, your plan and when it resets. (The plots go
  // unnamed: at the size a preview is mostly seen, their labels would only crowd the garden.)
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const layer = document.querySelector('.pins');
  layer.innerHTML = `<span class="pin friend"><i style="--c:${esc(FRIEND.color)}">${esc(FRIEND.name[0])}</i><span>${esc(FRIEND.name)}’s plan</span></span>`
    + `<span class="pin plan"><svg class="ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><circle class="left" cx="10" cy="10" r="7.5" pathLength="100"/></svg><span><b>Your AI plan</b><small></small></span></span>`;
  const friend = layer.querySelector('.friend'), plan = layer.querySelector('.plan');
  function place(at){
    friend.style.transform = `translate(${at.friend[0]}px,${at.friend[1]}px)`;
    plan.style.transform = `translate(${at.cloud[0]}px,${at.cloud[1] - at.cloud[3] / 2 - 4}px)`;
    plan.querySelector('.left').style.strokeDashoffset = 100 - Math.round(at.left * 100);
    const days = Math.ceil(at.left * 3);
    plan.querySelector('small').textContent = days > 1 ? `Resets in ${days} days` : 'Resets tomorrow';
  }

  // Your cloud goes out over the last plot, clear of the other one, and the picture is taken a moment into its rain
  // there. That's counted in frames drawn, not seconds, so a slow renderer takes the same picture.
  let raining = -1, frames = 0;
  const scene = createGarden(document.querySelector('canvas'), {
    dark: false, plots: PLOTS,
    onEvent: what => { if (what === 'rain') raining = frames; },
    onFrame: at => { place(at); frames++; if (raining >= 0 && frames - raining === 30) document.fonts.ready.then(() => { scene.setRunning(false); window.ogReady = true; }); }
  });
  scene.setRunning(true);
  scene.sendTo(3);
</script>
