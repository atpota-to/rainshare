name: Deploy droplet

# Deploys Rainshare's services to the droplet when a push to main touches what they run, by asking
# the droplet to run droplet/deploy.sh: the announcer (announcer/: @rainshare.dev's posts,
# messages and the approver's review) and the index (indexer/: every dev.rainshare.* record, in
# Supabase). The droplet:
#  - fetches the commit from GitHub itself
#  - deploys only the services set up there (a .env in each one's data folder)
#  - does nothing if what they run didn't change
#  - runs their tests
#  - restarts them, checks health, and rolls back on its own if any is unhealthy
#
# It's how atpota-to/atpota.to deploys Poe's services to the same droplet, with a key of its own.
# The DROPLET_DEPLOY_KEY secret can do nothing else: on the droplet it's pinned to
# droplet/ci-deploy.sh, which only accepts "announcer [commit on main]". droplet/README.md says
# how to set it up.
#
# "Run workflow" (Actions tab) redeploys by hand. Give it an older commit on main to roll back.

on:
  push:
    branches: [main]
    paths:
      - 'announcer/**'
      - 'indexer/**'
      - 'core/**'
      - 'lexicons/compat.mjs'
      - 'api/_og/describe.js'
      - 'ui/bits.js'
      - 'test/announce.test.mjs'
      - 'test/messages.test.mjs'
      - 'test/announcer.test.mjs'
      - 'test/review.test.mjs'
      - 'test/index-*.test.mjs'
      - 'droplet/**'
      - '.github/workflows/deploy-droplet.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA on main (blank = latest main). An older one rolls back.
        required: false
        default: ''

# One deploy at a time, never cancelled halfway. The droplet skips a commit whose code it's
# already running, so a run that GitHub drops from the queue loses nothing.
concurrency:
  group: droplet-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy
        env:
          KEY: ${{ secrets.DROPLET_DEPLOY_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          PUSHED: ${{ github.sha }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice title=Droplet deploy not set up::The DROPLET_DEPLOY_KEY secret isn't set, so nothing was deployed. See droplet/README.md."
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then commit="$INPUT_COMMIT"; else commit="$PUSHED"; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The droplet's host key, pinned (the same one atpota-to/atpota.to pins): never deploy to anything else.
          echo "hook.atpota.to ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAtZe9/XzO1UEI7e+QcU3XLtEvA7BlXM+4SVcYsYw8UH" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ConnectTimeout=20 root@hook.atpota.to "announcer $commit"
